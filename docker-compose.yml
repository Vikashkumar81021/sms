services:
  postgres:
    image: postgres:17-alpine
    container_name: school-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: school_admin
      POSTGRES_PASSWORD: school123
      POSTGRES_DB: school_db
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U school_admin -d school_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
